    <main>
        <section id="form-section" class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="form-container">
                            <div class="form-title text-center mb-4">
                                <h1>Complete la información</h1>
                            </div>
                            <form action="https://formspree.io/f/xkgnbpje" method="post"
                                class="p-4 border rounded shadow">
                                <fieldset>
                                    <legend class="mb-4 fw-bold">Datos Personales</legend>
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre [*]</label>
                                        <input type="text" name="nombre" id="nombre" class="form-control" maxlength="15"
                                            required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="apellido" class="form-label">Apellido [*]</label>
                                        <input type="text" name="apellido" id="apellido" class="form-control"
                                            maxlength="15" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="dni" class="form-label">DNI</label>
                                        <input type="number" name="dni" id="dni" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="correo" class="form-label">E-mail</label>
                                        <input type="email" name="correo" id="correo" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label for="comentarios" class="form-label">Escriba su consulta</label>
                                        <textarea name="comentarios" id="comentarios" class="form-control"
                                            rows="5"></textarea>
                                    </div>
                                </fieldset>
                                <div class="bottom-form mt-4">
                                    <div class="form-check mb-3">
                                        <input type="checkbox" name="condiciones" id="condiciones"
                                            class="form-check-input" required>
                                        <label for="condiciones" class="form-check-label">Acepto los términos y
                                            condiciones</label>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <button type="submit" class="btn btn-primary">Enviar Datos</button>
                                        <button type="reset" class="btn btn-secondary">Borrar</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
